version: 1
applications:
  - appRoot: apps/dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - cd "$CODEBUILD_SRC_DIR/vault" && NODE_ENV=development pnpm install --no-frozen-lockfile --prod=false
        build:
          commands:
            - cd "$CODEBUILD_SRC_DIR/vault/apps/dashboard" && "$CODEBUILD_SRC_DIR/vault/node_modules/.bin/next" build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../node_modules/**/*
  - appRoot: apps/market
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - cd "$CODEBUILD_SRC_DIR/vault" && NODE_ENV=development pnpm install --no-frozen-lockfile --prod=false
        build:
          commands:
            - cd "$CODEBUILD_SRC_DIR/vault/apps/market" && "$CODEBUILD_SRC_DIR/vault/node_modules/.bin/next" build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../node_modules/**/*
