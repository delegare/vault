[profile.default]
src = 'src'
out = 'out'
libs = ["../../node_modules", "lib"]
allow_paths = ['../../node_modules']
evm_version = 'paris'
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = 'long'
multiline_func_header = 'all'
quote_style = 'double'
number_underscore = 'preserve'

[etherscan]
base-sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=84532" }
base = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=8453" }
